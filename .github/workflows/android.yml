name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Public worker address (not a secret) -> repo variable POCKETBOT_API_URL.
      POCKETBOT_API_URL: ${{ vars.POCKETBOT_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pocketbot.jks"
            echo "POCKETBOT_KEYSTORE_FILE=$RUNNER_TEMP/pocketbot.jks" >> "$GITHUB_ENV"
            echo "Signing key found."
          else
            echo "No KEYSTORE_BASE64 secret: debug key for debug builds, release stays unsigned."
          fi

      - name: Unit tests (shared + engine)
        run: ./gradlew --no-daemon :shared:test :engine:test

      - name: Build debug APK
        env:
          POCKETBOT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          POCKETBOT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          POCKETBOT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketBot-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          POCKETBOT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          POCKETBOT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          POCKETBOT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
